[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drift"
version = "0.1.0"
description = "Endless, parameter-driven generative ambient music in pure numpy"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pygame = ["pygame-ce>=2.5"]

[tool.setuptools]
packages = ["drift"]
